name: BEAM Travel — PDF factuel V1

on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "travel/index.html"
      - "travel/factual-pdf.js"
      - "travel/factual-pdf-file.js"
      - "travel/supabase/migrations/20261031120000_optional_profile_contacts.sql"
      - "tests/travel-factual-pdf-file.cjs"
      - "tests/travel-factual-pdf-share-browser.cjs"
      - "tests/travel-factual-contacts-ui.cjs"
      - "travel/countries.js"
      - "travel/supabase/schema.sql"
      - "tests/travel-factual-pdf.cjs"
      - "tests/travel-factual-pdf-layout.cjs"
      - ".github/workflows/travel-factual-pdf.yml"

permissions:
  contents: read

jobs:
  pdf-contract:
    name: Liste fermée et anti-fuite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source view, privacy, user isolation and disclaimer
        run: node tests/travel-factual-pdf.cjs

  pdf-a4:
    name: Rendu PDF A4 multi-page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Verify printed PDF pages, statement and absence of images
        run: node tests/travel-factual-pdf-layout.cjs
      - name: Verify native share-file A4 bytes and contact opt-in
        run: node tests/travel-factual-pdf-file.cjs
      - name: Verify Android file share and safe local download fallback
        run: node tests/travel-factual-pdf-share-browser.cjs
      - name: Verify real mobile profile save, Auth email and one-shot consent
        run: node tests/travel-factual-contacts-ui.cjs
      - name: Upload 360px account contact layout (fictitious account only)
        uses: actions/upload-artifact@v4
        with:
          name: beam-travel-contacts-360px
          path: test-artifacts/travel-contact-finish/account-contacts-360.png
          if-no-files-found: error
          retention-days: 14
