name: BEAM Visa Guide — static preview and validation

on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "visas/**"
      - "scripts/build-visas.cjs"
      - "travel/index.html"
      - "travel/visa-guide.js"
      - "travel/sw.js"
      - "tests/travel-visa-*.cjs"
      - "tests/visas-*.cjs"
      - "tests/fixtures/visas/**"
      - "netlify.toml"
      - ".github/workflows/visas-static.yml"

permissions:
  contents: read

jobs:
  schema-and-build:
    name: Strict JSON schema, resilient production & preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate build script and tests
        run: |
          node --check scripts/build-visas.cjs
          node --check tests/visas-schema.cjs
          node --check tests/visas-mobile.cjs
          node tests/visas-schema.cjs
          node --check travel/visa-guide.js
          node --check tests/travel-visa-guide.cjs
          node tests/travel-visa-guide.cjs
      - name: Strictly check every JSON fiche (fail PR on malformed content)
        run: node scripts/build-visas.cjs --check
      - name: Render static preview (no secrets)
        run: node scripts/build-visas.cjs --preview
      - name: Verify production fallback or a published verified France
        run: |
          set -euo pipefail
          node scripts/build-visas.cjs --production
          test -f visas/index.html
          test -f visas/404.html
          if test -f visas/data/france.json; then
            node -e 'const fs=require("node:fs"),assert=require("node:assert/strict"); const france=JSON.parse(fs.readFileSync("visas/data/france.json","utf8")); assert.equal(france.statut,"publie"); assert.equal(france.types_visa.reduce((n,v)=>n+v.documents.length,0),16); assert.ok(fs.existsSync("visas/france/index.html")); assert.ok(fs.readFileSync("visas/index.html","utf8").includes("/visas/france/")); console.log("BEAM verified France is published, 16 documents: PASS");'
          else
            grep -q "Guide en préparation" visas/index.html
            grep -q "wa.me/224622095630" visas/index.html
            test ! -f visas/france/index.html
            echo "France source not supplied: only the preparation page is published."
          fi
      - name: Enforce untouched BTH and Supabase source trees
        shell: bash
        run: |
          set -euo pipefail
          if git diff --exit-code -- travel/ supabase/; then
            echo "Travel and Supabase trees were not modified by the generator."
          else
            echo "::error::Visa generator modified a protected tree"
            exit 1
          fi

  six-published:
    name: Release gate — six original BEAM destination fiches
    needs: [schema-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require six genuine, validated and generated pages
        run: |
          set -euo pipefail
          node scripts/build-visas.cjs --check
          node <<'NODE'
          const fs=require("node:fs");
          const path=require("node:path");
          const assert=require("node:assert/strict");
          const {buildSite}=require("./scripts/build-visas.cjs");
          const names=fs.readdirSync("visas/data").filter(x=>x.endsWith(".json")).sort();
          const expected=["canada.json","chine.json","france.json","maroc.json","royaume-uni.json","turquie.json"];
          assert.deepEqual(names,expected,
            "Six original BEAM JSON sources required. Missing maroc.json? Attach the BEAM file, not a synthetic example.");
          for(const name of names){
            const entry=JSON.parse(fs.readFileSync(path.join("visas/data",name),"utf8"));
            assert.equal(entry.statut,"publie",name+" must be a BEAM verified publication");
          }
          const result=buildSite({mode:"production"});
          assert.equal(result.published,6,"six fiches must actually publish");
          assert.equal(result.excluded.length,0,"no fiche should be excluded");
          const publicIndex=JSON.parse(fs.readFileSync("visas/fiches.json","utf8"));
          assert.equal(publicIndex.length,6,"every published destination needs an index entry");
          assert.deepEqual(publicIndex.map(x=>x.code_pays).sort(),["FR","CA","GB","TR","CN","MA"].sort());
          for(const row of publicIndex)
            assert.deepEqual(Object.keys(row).sort(),["code_pays","destination","slug"],
              "the BTH public listing must contain exactly three fields");
          const home=fs.readFileSync("visas/index.html","utf8");
          assert.doesNotMatch(home,/Guide en préparation/);
          for(const name of expected){
            const slug=name.slice(0,-5),file="visas/"+slug+"/index.html";
            assert.ok(fs.existsSync(file),file+" missing after production build");
            assert.ok(home.includes('href="/visas/'+slug+'/"'),"home must link "+slug);
            const entry=JSON.parse(fs.readFileSync(path.join("visas/data",name),"utf8"));
            const html=fs.readFileSync(file,"utf8");
            for(const type of entry.types_visa){
              if(type.lieu_depot.categorie==="en_ligne"){
                assert.match(html,/Démarche en ligne/);
                assert.match(html,/Ouvrir le portail officiel/);
                assert.ok(html.includes(type.lieu_depot.rendez_vous_url.replace(/&/g,"&amp;")),
                  name+" must link to BEAM's exact online portal URL");
              }
            }
          }
          console.log("Six verified BEAM fiches published and linked: PASS");
          NODE

  mobile:
    name: Real Chromium at 320, 360, 375 and 390px
    needs: [schema-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render generated visa pages (offline no-secret fixture)
        run: node tests/visas-mobile.cjs
      - name: Test BTH links on 320–390px with real HTML/CSS
        run: node tests/travel-visa-mobile.cjs
      - name: Upload mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-visas-preview-320-390
          path: test-artifacts/visas-mobile/
          if-no-files-found: ignore
          retention-days: 7
