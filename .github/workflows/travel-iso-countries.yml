name: BEAM Travel — ISO 249 pays et territoires

on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "travel/countries.js"
      - "travel/country-picker.js"
      - "travel/index.html"
      - "travel/factual-pdf.js"
      - "tests/travel-iso-countries.cjs"
      - "tests/travel-photo-queue.cjs"
      - "tests/travel-iso-countries-layout.cjs"
      - ".github/workflows/travel-iso-countries.yml"

permissions:
  contents: read

jobs:
  iso-contract:
    name: Catalogue, recherche et PDF
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/travel-iso-countries.cjs

  iso-mobile:
    name: Sélection ISO sur mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/travel-iso-countries-layout.cjs
