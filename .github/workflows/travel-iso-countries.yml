name: BEAM Travel — 249 pays avec recherche

on:
  pull_request:
    branches: [feature/travel-journal-mobile-finishes-v1, feature/beam-travel-history-v1]
    paths:
      - "travel/index.html"
      - "travel/countries.js"
      - "travel/country-picker.js"
      - "tests/travel-iso-countries.cjs"
      - "tests/travel-iso-countries-layout.cjs"
      - ".github/workflows/travel-iso-countries.yml"

permissions:
  contents: read

jobs:
  all-countries:
    name: 249 codes ISO, noms français et recherche
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node tests/travel-iso-countries.cjs
          node tests/travel-journal-finishes.cjs
          node tests/travel-factual-pdf.cjs
  country-search-mobile:
    name: Sélection mobile de pays et territoires
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/travel-iso-countries-layout.cjs
