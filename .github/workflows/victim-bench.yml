name: Victim bench — Staging (destructive, disposable accounts)

# Destructive by design: creates throwaway accounts on STAGING, deletes them through
# travel-delete, then replays their pre-deletion JWT. Never runs against production.
#
# Disabled until a maintainer sets the repository variable VICTIM_BENCH_ENABLED=true
# (Settings > Secrets and variables > Actions > Variables) after reviewing the bench.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "travel/supabase/**"
      - "supabase/functions/travel-delete/**"
      - ".github/workflows/victim-bench.yml"

# Shared with the hostile A/B bench: never two staging benches at the same time.
concurrency:
  group: hostile-ab-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  victim-bench:
    name: Disposable victim — full deletion protocol
    if: vars.VICTIM_BENCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # No secret is available to this step.
      - name: Preflight type check
        run: deno check travel/supabase/tests/victim_bench.ts

      # The ONLY step that receives the staging service key. Nothing is passed to later
      # steps and the script never prints keys, passwords, tokens or e-mail addresses.
      - name: Run disposable victim bench against staging
        env:
          SUPABASE_URL: ${{ secrets.STAGING_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_ANON_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
        run: deno run --allow-env --allow-net travel/supabase/tests/victim_bench.ts
