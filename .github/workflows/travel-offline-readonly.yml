name: "J'y étais — consultation hors ligne (confidentialité Android)"
on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "travel/index.html"
      - "travel/offline-store.js"
      - "travel/offline-readonly.css"
      - "travel/offline-bootstrap.js"
      - "travel/sw.js"
      - "tests/travel-offline-store.cjs"
      - "tests/travel-offline-mobile.cjs"
      - "tests/travel-pwa-privacy.cjs"
      - ".github/workflows/travel-offline-readonly.yml"
permissions:
  contents: read
jobs:
  offline:
    name: Cache privé 30 jours et Android 320–390
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source invariants and no SQL migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA"...HEAD -- travel/supabase
          node --check travel/offline-store.js
          node --check travel/offline-bootstrap.js
          node --check travel/sw.js
          node --check tests/travel-offline-store.cjs
          node --check tests/travel-offline-mobile.cjs
          node tests/travel-offline-store.cjs
          node tests/travel-pwa-privacy.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real offline PWA / IndexedDB / Android checks (fictional data)
        run: |
          node tests/travel-offline-mobile.cjs
          node tests/travel-pwa-install-ui.cjs
      - name: Preserve three 360px screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jyetais-hors-ligne-360px
          path: |
            test-artifacts/jyetais-offline/offline-accueil-360.png
            test-artifacts/jyetais-offline/offline-carte-conakry-360.png
            test-artifacts/jyetais-offline/offline-fiche-360.png
            test-artifacts/jyetais-offline/offline-parametres-360.png
          if-no-files-found: warn
          retention-days: 14
