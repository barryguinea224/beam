name: Hostile A/B — Staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "travel/**"
      - ".github/workflows/hostile-ab.yml"

concurrency:
  group: hostile-ab-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hostile-ab:
    name: Real JWT / RLS hostile bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight hostile bench
        run: |
          deno fmt --check travel/supabase/tests/hostile_ab.ts travel/constants.js
          deno check travel/supabase/tests/hostile_ab.ts

      - name: Validate required secrets
        shell: bash
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
          TEST_B_EMAIL: ${{ secrets.TEST_B_EMAIL }}
          TEST_B_PASSWORD: ${{ secrets.TEST_B_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in STAGING_URL STAGING_ANON_KEY TEST_A_EMAIL TEST_A_PASSWORD TEST_B_EMAIL TEST_B_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name: MISSING (length 0)"
              missing=1
            else
              echo "$name: SET (length ${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required staging secrets are missing or empty."
            exit 1
          fi
          echo "Required staging secrets are configured."

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run hostile A/B bench against staging
        env:
          SUPABASE_URL: ${{ secrets.STAGING_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_ANON_KEY }}
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
          TEST_B_EMAIL: ${{ secrets.TEST_B_EMAIL }}
          TEST_B_PASSWORD: ${{ secrets.TEST_B_PASSWORD }}
        run: deno run --allow-env --allow-net travel/supabase/tests/hostile_ab.ts
