name: Deploy BEAM Travel Edge Functions — production (manual)

# Before running: manually create protected GitHub environment "production".
# Require reviewers, restrict deployment branch to main and place a short-lived
# production-project-only token in the ENVIRONMENT secret SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-travel-production-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'barryguinea224/beam' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify local function sources and JWT settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, tomllib
          cfg=tomllib.loads(pathlib.Path("supabase/config.toml").read_text())
          expected={"travel-delete":True,"travel-deletion-retry":False,"travel-deletion-monitor":False}
          for name,jwt in expected.items():
              assert cfg["functions"][name]["verify_jwt"] is jwt, "Unexpected JWT mode"
              assert pathlib.Path("supabase/functions",name,"index.ts").is_file()
          for shared in ("travel-deletion.ts","travel-public-errors.ts","travel-deletion-health.ts","travel-retry-runner.ts"):
              assert pathlib.Path("supabase/functions/_shared",shared).is_file()
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Deploy precisely three functions (no invocation)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing production environment secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          ref="aojxeujjluhmnkwscndc"
          supabase functions deploy travel-delete --project-ref "$ref"
          supabase functions deploy travel-deletion-retry --project-ref "$ref" --no-verify-jwt
          supabase functions deploy travel-deletion-monitor --project-ref "$ref" --no-verify-jwt
