name: One-time BTH icon raster export
on:
  push:
    branches: [feature/bth-pwa-new-logo-20261102]
    paths:
      - "travel/icons/icon-192.png"
      - "travel/icons/src/**"
      - "scripts/render-bth-icons.py"
      - ".github/workflows/bth-icon-export.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bth-pwa-new-logo-20261102
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image renderer
        run: python -m pip install "Pillow==12.3.0"
      - name: Generate 512px PNGs from selected 192px source
        run: python scripts/render-bth-icons.py
      - name: Commit generated images to this PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel/icons/icon-512.png travel/icons/icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(travel): export 512px and full-bleed maskable BTH icons"
            git push origin HEAD:feature/bth-pwa-new-logo-20261102
          fi
