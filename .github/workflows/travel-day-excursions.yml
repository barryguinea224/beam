name: "J'y étais — Excursions d'une journée (Android, PDF)"
on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "travel/index.html"
      - "travel/day-excursions.*"
      - "travel/trip-stops.js"
      - "travel/visual-cards.js"
      - "travel/printable-journal.js"
      - "travel/family-booklet.js"
      - "travel/sw.js"
      - "tests/travel-day-excursions*.cjs"
      - ".github/workflows/travel-day-excursions.yml"
permissions:
  contents: read
jobs:
  day-excursions:
    name: One-day trips, overlapping excursions and Android 320–390
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, model, projections, factual PDF invariants
        run: |
          node --check travel/day-excursions.js
          node --check travel/trip-stops.js
          node --check travel/visual-cards.js
          node --check travel/printable-journal.js
          node --check travel/family-booklet.js
          node --check tests/travel-day-excursions.cjs
          node --check tests/travel-day-excursions-mobile.cjs
          node tests/travel-day-excursions.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real page, fictional Supabase, Android 320 360 390
        run: node tests/travel-day-excursions-mobile.cjs
      - name: Upload fictional 360-px screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jyetais-excursions-360px
          path: test-artifacts/day-excursions/*-360.png
          if-no-files-found: warn
