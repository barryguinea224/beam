name: "J'y étais — accueil sobre (Android, typographie, PDF)"
on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "travel/index.html"
      - "travel/home-simple.css"
      - "travel/sw.js"
      - "travel/assets/fonts/**"
      - "tests/travel-home-simple-mobile.cjs"
      - "tests/travel-factual-contacts-ui.cjs"
      - ".github/workflows/travel-home-simple.yml"
permissions:
  contents: read
jobs:
  accueil:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and local fonts
        run: |
          node --check tests/travel-home-simple-mobile.cjs
          node tests/travel-dashboard-filters.cjs
          node tests/travel-factual-pdf.cjs
          test -s travel/assets/fonts/Poppins-Regular.woff2
          test -s travel/assets/fonts/Poppins-SemiBold.woff2
          test -s travel/assets/fonts/Poppins-Bold.woff2
          grep -q 'SIL OPEN FONT LICENSE' travel/assets/fonts/OFL.txt
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture source branch before / after with fictional data
        run: |
          mkdir -p test-artifacts/home-simple
          git show "${{ github.event.pull_request.base.sha }}:travel/index.html" > test-artifacts/home-simple/baseline.html
          node tests/travel-home-simple-mobile.cjs test-artifacts/home-simple/baseline.html
          node tests/travel-factual-contacts-ui.cjs
      - name: Upload Android 360 px before and after
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jyetais-accueil-avant-apres-360px
          path: |
            test-artifacts/home-simple/avant-haut-360.png
            test-artifacts/home-simple/avant-voyages-360.png
            test-artifacts/home-simple/apres-haut-360.png
            test-artifacts/home-simple/apres-voyages-360.png
            test-artifacts/home-simple/apres-fenetre-pdf-360.png
          if-no-files-found: warn
