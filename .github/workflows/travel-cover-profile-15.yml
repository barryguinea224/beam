name: "J'y étais — couverture privée et 15 photos (Android)"
on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "travel/index.html"
      - "travel/profile-cover.js"
      - "travel/profile-cover-ui.js"
      - "travel/profile-cover.css"
      - "travel/photo-utils.js"
      - "travel/family-booklet.js"
      - "travel/visual-cards.js"
      - "travel/assets/countries/sn.svg"
      - "travel/supabase/migrations/20261114200000_cover_and_15_photos.sql"
      - "tests/travel-profile-cover.cjs"
      - ".github/workflows/travel-cover-profile-15.yml"
permissions:
  contents: read
jobs:
  android-cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check no secrets, no private URLs cached, syntax
        run: |
          node --check tests/travel-profile-cover.cjs
          node --check travel/profile-cover-ui.js
          node --check travel/profile-cover.js
          node tests/travel-private-photos.cjs
          node tests/travel-visual-cards.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check real 320–390px interface with fictional photos only
        run: node tests/travel-profile-cover.cjs
      - name: Attach Android 360px screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jyetais-couverture-360px-fictif
          path: |
            test-artifacts/cover-profile/accueil-couverture-360.png
            test-artifacts/cover-profile/parametres-choix-couverture-360.png
            test-artifacts/cover-profile/carte-senegal-360.png
          if-no-files-found: warn
