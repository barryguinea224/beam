name: Deploy BEAM Travel functions — STAGING ONLY

# Migration vérifiée par Julaybib sur staging : 10 fonctions %deletion%,
# 0 exécutable par anon, 0 par authenticated, private.deletion_retry_runs présente.
# REVIEW BEFORE FIRST EXECUTION. Does not run on push or synchronize.
# Require explicit PR label AND approval of protected environment staging-functions-deploy.
# Do not give this workflow production secrets or service-role credentials.
# Does not apply migrations, configure secrets, run deletions, or enable cron.

on:
  pull_request:
    types: [labeled]
    branches: [feature/beam-travel-history-v1]

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight staging functions (no credentials)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'staging-functions-deploy-approved' &&
      github.event.pull_request.number == 6 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/travel-deletion-retry-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert function configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib
          config = tomllib.loads(pathlib.Path("supabase/config.toml").read_text())
          expected = {
              "travel-delete": True,
              "travel-deletion-retry": False,
              "travel-deletion-monitor": False,
          }
          for name, jwt in expected.items():
              assert config["functions"][name]["verify_jwt"] is jwt, f"Unexpected JWT setting for {name}"
              assert pathlib.Path(f"supabase/functions/{name}/index.ts").is_file()
          assert pathlib.Path("supabase/functions/_shared/travel-deletion.ts").is_file()
          print("Function source and JWT configuration verified.")
          PY
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck reviewed functions
        run: |
          set -euo pipefail
          deno check supabase/functions/travel-delete/index.ts
          deno check supabase/functions/travel-deletion-retry/index.ts
          deno check supabase/functions/travel-deletion-monitor/index.ts

  deploy:
    name: Deploy three Edge Functions to staging ONLY
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create this environment with required reviewers before adding the label.
    environment: staging-functions-deploy
    concurrency:
      group: beam-travel-functions-staging-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout same reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fail closed if deployment token is absent
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing environment-only STAGING_SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only the three reviewed functions
        shell: bash
        run: |
          set -euo pipefail
          # Hardcoded known staging project; never derive target from inputs.
          project_ref="coigbvhxywbmqgacmhzf"
          supabase functions deploy travel-delete --project-ref "$project_ref"
          supabase functions deploy travel-deletion-retry --project-ref "$project_ref"
          supabase functions deploy travel-deletion-monitor --project-ref "$project_ref"
          supabase functions list --project-ref "$project_ref"
      - name: Confirm missing secrets cannot invoke worker and monitor
        shell: bash
        run: |
          set -euo pipefail
          base="https://coigbvhxywbmqgacmhzf.supabase.co/functions/v1"
          for path in travel-deletion-retry travel-deletion-monitor; do
            if [ "$path" = "travel-deletion-retry" ]; then method=POST; else method=GET; fi
            status="$(curl --silent --show-error --max-time 25 --output /dev/null --write-out '%{http_code}' --request "$method" "$base/$path")"
            if [ "$status" != "401" ]; then
              echo "::error::$path must refuse unauthenticated requests (HTTP $status)"
              exit 1
            fi
          done
          echo "Protected endpoints refused requests without secrets."

# Deliberately no workflow_dispatch or automatic push trigger. PR review first.
