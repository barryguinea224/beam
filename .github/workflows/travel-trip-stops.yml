name: BTH — étapes de voyage (SQL, Android, PDF)
on:
  pull_request:
    branches: [feature/beam-travel-history-v1]
    paths:
      - "travel/**"
      - "tests/travel-trip-stops*.cjs"
      - ".github/workflows/travel-trip-stops.yml"
permissions:
  contents: read
jobs:
  steps-android-pdf:
    name: Stops, itinerary, PDF natif et écrans Android 320–390
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real projection and native factual-PDF checks
        run: |
          node tests/travel-trip-stops.cjs
          node tests/travel-trip-stops-pdf-preview.cjs
      - name: Browser test infrastructure
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Android 320, 360, 390 px (synthetic-only)
        run: node tests/travel-trip-stops-mobile.cjs
      - name: Upload actual BTH PDF previews and Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bth-trip-stops-france-germany-android-pdf
          path: |
            test-artifacts/trip-stops/*.png
            test-artifacts/trip-stops/*.pdf
          if-no-files-found: error
