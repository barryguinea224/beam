[build]
  publish = "."
  command = "node scripts/build-travel-config.cjs && node scripts/build-visas.cjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/visas/fiches.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/travel/config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Les fichiers source du guide sont contenus dans le publish="." mais ne
# doivent jamais être délivrés par HTTP. Force override pour les vrais fichiers.
[[redirects]]
  from = "/visas/data/*"
  to = "/visas/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/visas/README.md"
  to = "/visas/404.html"
  status = 404
  force = true
